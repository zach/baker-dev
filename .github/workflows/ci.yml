name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-13 C++20,       os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "" }
          - { name: clang-18 C++20,     os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 20, flags: "" }
          - { name: clang-18 C++23,     os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 23, flags: "" }
          - { name: clang-18 libc++,    os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 20, flags: "-DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++", packages: "libc++-18-dev libc++abi-18-dev" }
          - { name: gcc-13 C++23,       os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 23, flags: "" }
          - { name: data only,          os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "-DMOIRA_BUILD_SCRIPT=OFF" }
          - { name: asan+ubsan,         os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 20, flags: "-DMOIRA_SANITIZE=address,undefined" }
          - { name: tsan,               os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 20, flags: "-DMOIRA_SANITIZE=thread" }
          - { name: plain refcounts,    os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "-DMOIRA_ATOMIC_REFCOUNT=OFF" }
          - { name: shipping,           os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "-DMOIRA_SHIPPING=ON" }
          - { name: eastl,              os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "-DMOIRA_USE_EASTL=ON" }
          - { name: msvc C++20,         os: windows-2022,  cc: cl,       cxx: cl,         std: 20, flags: "" }
          - { name: msvc C++latest,     os: windows-2022,  cc: cl,       cxx: cl,         std: 23, flags: "" }
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.packages }}
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          ${{ matrix.flags }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz:
    name: fuzz (libFuzzer, ASan+UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-rt-18-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DMOIRA_BUILD_FUZZERS=ON -DMOIRA_BUILD_TESTS=OFF -DMOIRA_BUILD_TOOLS=OFF \
            -DMOIRA_SANITIZE=address,undefined
          cmake --build build
      - name: Fuzz the parser for 2 minutes
        run: |
          mkdir -p corpus artifacts
          cp tests/corpus/*.dta tests/fuzz_regressions/*.bin corpus/
          build/moira_parse_fuzzer -dict=fuzz/dta.dict -max_len=4096 -max_total_time=120 \
            -print_final_stats=1 -artifact_prefix=artifacts/ corpus
      - name: Fuzz lookups for 1 minute
        run: |
          mkdir -p lookup_corpus
          for f in tests/corpus/*.dta; do
            for p in "renderer.clear_color.0" "menu.'bacon and eggs'.price" "app/title"; do
              { echo "$p"; cat "$f"; } > "lookup_corpus/$(basename "$f").$(echo "$p" | md5sum | cut -c1-8)"
            done
          done
          build/moira_lookup_fuzzer -dict=fuzz/dta.dict -max_len=4096 -max_total_time=60 \
            -print_final_stats=1 -artifact_prefix=artifacts/ lookup_corpus
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: artifacts/

  bench:
    name: benchmarks (informational)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMOIRA_BUILD_BENCH=ON -DMOIRA_BUILD_TESTS=OFF
          cmake --build build
          build/moira_bench_parse
          build/moira_bench_lookup

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: |
          files=$(git ls-files '*.hpp' '*.cpp' ':!third_party')
          [ -z "$files" ] || clang-format-18 --dry-run --Werror $files
      - name: Line budget (informational)
        run: python3 tools/count_lines.py
