name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-13 C++20,       os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "" }
          - { name: clang-18 C++20,     os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 20, flags: "" }
          - { name: clang-18 C++23,     os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 23, flags: "" }
          - { name: clang-18 libc++,    os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 20, flags: "-DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++", packages: "libc++-18-dev libc++abi-18-dev" }
          - { name: gcc-13 C++23,       os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 23, flags: "" }
          - { name: data only,          os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "-DBAKER_BUILD_SCRIPT=OFF" }
          - { name: asan+ubsan,         os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 20, flags: "-DBAKER_SANITIZE=address,undefined" }
          - { name: tsan,               os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 20, flags: "-DBAKER_SANITIZE=thread" }
          - { name: plain refcounts,    os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "-DBAKER_ATOMIC_REFCOUNT=OFF" }
          - { name: shipping,           os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "-DBAKER_SHIPPING=ON" }
          - { name: eastl,              os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "-DBAKER_USE_EASTL=ON" }
          - { name: harness,            os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "-DBAKER_BUILD_HARNESS=ON", packages: "libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev" }
          - { name: msvc C++20,         os: windows-2022,  cc: cl,       cxx: cl,         std: 20, flags: "-DBAKER_BUILD_HARNESS=ON" }
          - { name: msvc C++latest,     os: windows-2022,  cc: cl,       cxx: cl,         std: 23, flags: "" }
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.packages }}
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          ${{ matrix.flags }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The game stacks (stacks/README.md): a separate project over Baker, for Windows PC.
  # Linux builds it too, as the container the stacks are developed in does.
  stacks:
    name: stacks ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: msvc,   os: windows-2022, cc: cl,     cxx: cl }
          - { name: gcc-13, os: ubuntu-24.04, cc: gcc-13, cxx: g++-13 }
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxext-dev libgl-dev libegl-dev
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: bash
        run: >
          cmake -S stacks -B build-stacks -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build-stacks
      - name: Test
        run: ctest --test-dir build-stacks --output-on-failure

  # Each stack's game, packaged for a Windows machine with no developer tools: a Release
  # build with the C runtime linked statically, its data and packs beside it, run once
  # headless, and uploaded as the run's artifact "stacks-<game>-windows".
  stacks-package:
    name: stacks package ${{ matrix.game }} (Windows)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        game: [cube, duel, ledger, contraption, stuntline, hearth, wayfarer]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: bash
        run: |
          cmake -S stacks -B build-package -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DSTACKS_BUILD_TESTS=OFF
          cmake --build build-package --target stacks_${{ matrix.game }}
      - name: Package
        shell: bash
        run: |
          game=${{ matrix.game }}
          mkdir -p package/data
          cp build-package/bin/stacks_$game.exe package/
          cp -r stacks/$game/data/* package/data/  # Wayfarer's regions/ too
          if [ -d stacks/$game/packs ]; then cp -r stacks/$game/packs package/; fi
          cp stacks/$game/package/README.txt package/
          cd package && ./stacks_$game.exe --headless --frames 60 --console-port 0
      - uses: actions/upload-artifact@v4
        with:
          name: stacks-${{ matrix.game }}-windows
          path: package/

  fuzz:
    name: fuzz (libFuzzer, ASan+UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-rt-18-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DBAKER_BUILD_FUZZERS=ON -DBAKER_BUILD_TESTS=OFF -DBAKER_BUILD_TOOLS=OFF \
            -DBAKER_SANITIZE=address,undefined
          cmake --build build
      - name: Fuzz the parser for 2 minutes
        run: |
          mkdir -p corpus artifacts
          cp tests/corpus/*.dta tests/fuzz_regressions/*.bin corpus/
          build/baker_parse_fuzzer -dict=fuzz/dta.dict -max_len=4096 -max_total_time=120 \
            -print_final_stats=1 -artifact_prefix=artifacts/ corpus
      - name: Fuzz lookups for 1 minute
        run: |
          mkdir -p lookup_corpus
          for f in tests/corpus/*.dta; do
            for p in "renderer.clear_color.0" "menu.'bacon and eggs'.price" "app/title"; do
              { echo "$p"; cat "$f"; } > "lookup_corpus/$(basename "$f").$(echo "$p" | md5sum | cut -c1-8)"
            done
          done
          build/baker_lookup_fuzzer -dict=fuzz/dta.dict -max_len=4096 -max_total_time=60 \
            -print_final_stats=1 -artifact_prefix=artifacts/ lookup_corpus
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: artifacts/

  bench:
    name: benchmarks (informational)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBAKER_BUILD_BENCH=ON -DBAKER_BUILD_TESTS=OFF
          cmake --build build
          build/baker_bench_parse
          build/baker_bench_lookup

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: |
          files=$(git ls-files '*.hpp' '*.cpp' ':!third_party')
          [ -z "$files" ] || clang-format-18 --dry-run --Werror $files
      - name: Line budget (informational)
        run: python3 tools/count_lines.py

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy-18
      - name: clang-tidy over src (.clang-tidy, D103)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBAKER_BUILD_TESTS=OFF -DBAKER_BUILD_EXAMPLES=OFF
          run-clang-tidy-18 -p build -quiet 'src/.*\.cpp$'
