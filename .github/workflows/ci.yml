name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-13 C++20,       os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "" }
          - { name: clang-18 C++20,     os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 20, flags: "" }
          - { name: clang-18 C++23,     os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 23, flags: "" }
          - { name: gcc-13 C++23,       os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 23, flags: "" }
          - { name: data only,          os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "-DMOIRA_BUILD_SCRIPT=OFF" }
          - { name: asan+ubsan,         os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 20, flags: "-DMOIRA_SANITIZE=address,undefined" }
          - { name: tsan atomic-rc,     os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 20, flags: "-DMOIRA_SANITIZE=thread -DMOIRA_ATOMIC_REFCOUNT=ON" }
          - { name: shipping,           os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "-DMOIRA_SHIPPING=ON" }
          - { name: msvc C++20,         os: windows-2022,  cc: cl,       cxx: cl,         std: 20, flags: "" }
          - { name: msvc C++latest,     os: windows-2022,  cc: cl,       cxx: cl,         std: 23, flags: "" }
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          ${{ matrix.flags }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: |
          files=$(git ls-files '*.hpp' '*.cpp' ':!third_party')
          [ -z "$files" ] || clang-format-18 --dry-run --Werror $files
      - name: Line budget (informational)
        run: tools/count_lines.sh
