name: Release

# Publishes Baker's core library to github.com/zach/baker (docs/releasing.md). Run by hand
# from the Actions tab, on main, by the owner or at the owner's request; never on a push.
# Without `publish`, it builds and tests the release and stops, leaving the tree as an
# artifact to read.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, MAJOR.MINOR.PATCH (the tree must declare it)"
        required: true
        type: string
      publish:
        description: "Push the release to zach/baker and tag it (unchecked: build and test only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Releases come from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::run the release from main, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@v4
      - name: Build and check the public tree
        run: python3 tools/release/publish.py prepare --version "$VERSION" --out public --notes notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: baker-${{ inputs.version }}
          path: |
            public
            notes.md
          include-hidden-files: true
          if-no-files-found: error

  verify:
    name: verify ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: gcc-13,           os: ubuntu-24.04, cc: gcc-13,   cxx: g++-13,     flags: "" }
          - { name: clang-18 asan,    os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, flags: "-DBAKER_SANITIZE=address,undefined" }
          - { name: gcc-13 shipping,  os: ubuntu-24.04, cc: gcc-13,   cxx: g++-13,     flags: "-DBAKER_SHIPPING=ON" }
          - { name: msvc,             os: windows-2022, cc: cl,       cxx: cl,         flags: "" }
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: baker-${{ inputs.version }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Format
        if: matrix.name == 'gcc-13'
        shell: bash
        run: |
          cd public
          find . -path ./third_party -prune -o \( -name '*.hpp' -o -name '*.cpp' \) -print0 |
            xargs -0 clang-format-18 --dry-run --Werror
      - name: Configure
        shell: bash
        run: >
          cmake -S public -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          ${{ matrix.flags }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  publish:
    needs: verify
    if: inputs.publish
    runs-on: ubuntu-24.04
    # Settings > Environments > release can require the owner's approval before this runs.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          path: dev
      - uses: actions/download-artifact@v4
        with:
          name: baker-${{ inputs.version }}
      - name: Clone zach/baker
        env:
          TOKEN: ${{ secrets.BAKER_PUBLISH_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::the BAKER_PUBLISH_TOKEN secret is not set"; exit 1; }
          git clone "https://x-access-token:${TOKEN}@github.com/zach/baker.git" baker
      - name: Commit and tag
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          git -C baker config user.name "$ACTOR"
          git -C baker config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          python3 dev/tools/release/publish.py commit --tree public --repo baker \
            --version "$VERSION" --notes notes.md
      - name: Push
        run: git -C baker push origin HEAD:main "v$VERSION"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.BAKER_PUBLISH_TOKEN }}
        run: gh release create "v$VERSION" --repo zach/baker --title "Baker $VERSION" --notes-file notes.md
